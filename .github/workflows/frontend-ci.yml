name: AutoFix Frontend Full-Stack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-e2e:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autofix
          POSTGRES_PASSWORD: autofix
          POSTGRES_DB: autofix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autofix -d autofix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out frontend
        uses: actions/checkout@v4

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/autofix_backend
          path: autofix_backend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: autofix_backend
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Apply backend migrations
        working-directory: autofix_backend
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://autofix:autofix@localhost:5432/autofix_test
          SECRET_KEY: ci-only-autofix-secret
          APP_ENV: test
          BCRYPT_ROUNDS: "4"

      - name: Seed demo data
        working-directory: autofix_backend
        run: python scripts/seed.py
        env:
          DATABASE_URL: postgresql+asyncpg://autofix:autofix@localhost:5432/autofix_test
          SECRET_KEY: ci-only-autofix-secret
          APP_ENV: test
          BCRYPT_ROUNDS: "4"
          ALLOWED_ORIGINS: '["http://127.0.0.1:3000","http://localhost:3000"]'

      - name: Start backend API
        working-directory: autofix_backend
        env:
          DATABASE_URL: postgresql+asyncpg://autofix:autofix@localhost:5432/autofix_test
          SECRET_KEY: ci-only-autofix-secret
          APP_ENV: test
          BCRYPT_ROUNDS: "4"
          ALLOWED_ORIGINS: '["http://127.0.0.1:3000","http://localhost:3000"]'
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/autofix-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/autofix-api.log
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_COMPANY_NAME: AutoFix Garage
          NEXT_PUBLIC_CURRENCY: USD

      - name: Start frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_COMPANY_NAME: AutoFix Garage
          NEXT_PUBLIC_CURRENCY: USD
        run: |
          nohup npm start > /tmp/autofix-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/autofix-web.log
          exit 1

      - name: Install Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Run browser integration tests
        run: npx --yes playwright@1.56.1 test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofix-e2e-evidence
          path: e2e/evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofix-service-logs
          path: |
            /tmp/autofix-api.log
            /tmp/autofix-web.log
          if-no-files-found: ignore
          retention-days: 7
