name: Temporary Formatting

on:
  push:
    branches:
      - chore/formatting-only-autofix

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/formatting-only-autofix
          fetch-depth: 0

      - name: Format with pinned Prettier
        run: |
          npx --yes prettier@3.6.2 --write \
            "src/**/*.{ts,tsx,js,jsx,json,css,md}" \
            "package.json" \
            "tsconfig.json" \
            "next.config.{js,mjs,ts}" \
            "postcss.config.{js,mjs,cjs,ts}" \
            "eslint.config.{js,mjs,cjs,ts}" \
            "*.md"
      
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json tsconfig.json README.md *.md
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "Format frontend source with Prettier"
            git push origin HEAD:chore/formatting-only-autofix
          fi
