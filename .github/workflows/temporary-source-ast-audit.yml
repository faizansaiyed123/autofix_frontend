name: Temporary TypeScript Source AST Audit

on:
  push:
    branches:
      - chore/formatting-only-autofix

permissions:
  contents: read

jobs:
  source-ast-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch and history
        uses: actions/checkout@v4
        with:
          ref: chore/formatting-only-autofix
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install existing project dependencies
        run: npm ci --no-audit --no-fund

      - name: Compare TypeScript source ASTs and JSX runtime output against main
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const ts = require("typescript");

          const base = "origin/main";
          const files = execFileSync("git", ["diff", "--name-only", base + "...HEAD"], { encoding: "utf8" })
            .trim().split("\n").filter(Boolean);

          function git(args) {
            return execFileSync("git", args, { encoding: "utf8", maxBuffer: 20 * 1024 * 1024 });
          }

          function canonical(node, jsxRuntime = false) {
            if (node.kind === ts.SyntaxKind.ParenthesizedExpression) return canonical(node.expression, jsxRuntime);
            if (ts.isJsxText(node)) return jsxRuntime ? ["JsxText", node.text] : null;

            // Prettier may split JSX whitespace into an explicit {" "} child.
            // Its exact runtime text is independently checked by emittedAst().
            if (!jsxRuntime && ts.isJsxExpression(node) && node.expression &&
                ts.isStringLiteral(node.expression) && /^\s*$/.test(node.expression.text)) {
              return null;
            }

            if (ts.isNumericLiteral(node)) {
              const value = Number(node.text.replaceAll("_", ""));
              return ["NumericLiteral", Number.isFinite(value) ? String(value) : node.text];
            }
            if (ts.isIdentifier(node)) return ["Identifier", String(node.escapedText)];
            if (ts.isStringLiteral(node) || ts.isNoSubstitutionTemplateLiteral(node)) {
              return [ts.SyntaxKind[node.kind], node.text];
            }

            const children = [];
            ts.forEachChild(node, child => {
              const item = canonical(child, jsxRuntime);
              if (item !== null) children.push(item);
            });
            return [ts.SyntaxKind[node.kind], children];
          }

          function sourceAst(source, file) {
            const kind = /\.tsx$/i.test(file) ? ts.ScriptKind.TSX : ts.ScriptKind.TS;
            const parsed = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, kind);
            if (parsed.parseDiagnostics.length) {
              throw new Error(file + ": parse diagnostics found");
            }
            return JSON.stringify(canonical(parsed, false));
          }

          function emittedAst(source, file) {
            const result = ts.transpileModule(source, {
              fileName: file,
              reportDiagnostics: true,
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
                jsx: ts.JsxEmit.ReactJSX,
                removeComments: true,
                useDefineForClassFields: false,
              },
            });
            const errors = (result.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) throw new Error(file + ": " + errors.map(d => ts.flattenDiagnosticMessageText(d.messageText, " ")).join("; "));
            const output = ts.createSourceFile(file + ".js", result.outputText, ts.ScriptTarget.ES2022, true, ts.ScriptKind.JS);
            return JSON.stringify(canonical(output, true));
          }

          const checked = [];
          const failures = [];
          for (const file of files.filter(name => /\.(ts|tsx)$/i.test(name))) {
            const oldSource = git(["show", base + ":" + file]);
            const newSource = fs.readFileSync(file, "utf8");
            checked.push(file);
            try {
              if (sourceAst(oldSource, file) !== sourceAst(newSource, file)) {
                failures.push(file + " (TypeScript source AST differs)");
              } else if (emittedAst(oldSource, file) !== emittedAst(newSource, file)) {
                failures.push(file + " (emitted JavaScript/JSX AST differs)");
              }
            } catch (error) {
              failures.push(file + " (" + error.message + ")");
            }
          }

          console.log("TypeScript source files checked:", checked.length);
          console.log("Total changed files in comparison:", files.length);
          if (failures.length) {
            console.error("Potential non-formatting differences:");
            for (const failure of failures) console.error(" - " + failure);
            process.exit(1);
          }
          console.log("PASS: TypeScript source ASTs and emitted JavaScript/JSX ASTs are identical to main.");
          NODE
