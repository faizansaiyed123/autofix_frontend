name: AutoFix Frontend Demo CI

on:
  push:
    branches: [demo]
  pull_request:
    branches: [demo]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out demo branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_COMPANY_NAME: AutoFix Garage
          NEXT_PUBLIC_CURRENCY: USD

      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start demo frontend
        run: |
          nohup npm start > /tmp/autofix-demo-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/autofix-demo-web.log
          exit 1

      - name: Run demo browser checks
        run: npx playwright test e2e/demo.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

      - name: Upload browser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofix-frontend-demo-logs
          path: /tmp/autofix-demo-web.log
          if-no-files-found: ignore
          retention-days: 7
